<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexathel v16 Asistanı</title>
    <style>
        :root {
            --bg: #030712;
            --surface: #0b1329;
            --accent: #00f0ff;
            --accent-dim: rgba(0, 240, 255, 0.15);
            --text-main: #e2e8f0;
            --text-dim: #64748b;
            --border: #1e293b;
            --cyber-glow: 0 0 12px rgba(0, 240, 255, 0.6);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
        }

        /* Siber Arka Plan Izgarası */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -1; pointer-events: none;
        }

        .app-layer {
            display: flex; flex-direction: column;
            width: 100%; height: 100%;
            position: fixed; top: 0; left: 0;
        }

        .hidden { display: none !important; }

        /* GİRİŞ EKRANI */
        #login-screen {
            justify-content: center; align-items: center;
            padding: 30px; text-align: center; background: var(--bg);
        }

        .welcome-card { 
            width: 100%; max-width: 400px; 
            background: rgba(11, 19, 41, 0.6);
            border: 1px solid var(--accent);
            padding: 30px; border-radius: 16px;
            box-shadow: var(--cyber-glow), inset 0 0 20px rgba(0, 240, 255, 0.1);
            backdrop-filter: blur(8px);
        }
        
        input {
            width: 100%; background: rgba(3, 7, 18, 0.7); border: 1px solid var(--border);
            padding: 16px; border-radius: 14px; color: #ffffff;
            font-size: 16px; margin: 20px 0; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: var(--cyber-glow); }

        .btn-main {
            width: 100%; background: transparent; color: var(--accent);
            border: 1px solid var(--accent); padding: 16px; border-radius: 14px;
            font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s;
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.2);
        }
        .btn-main:hover, .btn-main:active {
            background: var(--accent); color: #000000; box-shadow: var(--cyber-glow);
        }

        /* CHAT EKRANI */
        header {
            padding: 20px; border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(12px);
        }

        #chat-flow {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .bubble {
            max-width: 85%; padding: 12px 16px; border-radius: 18px;
            font-size: 15px; line-height: 1.5; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .u-msg { 
            background: var(--accent-dim); color: var(--accent); 
            align-self: flex-end; border: 1px solid var(--accent);
            border-bottom-right-radius: 4px;
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.1);
        }
        .ai-msg { 
            background: rgba(11, 19, 41, 0.8); border: 1px solid var(--border); 
            align-self: flex-start; border-bottom-left-radius: 4px;
        }

        /* FOOTER */
        footer { 
            padding: 15px; background: rgba(3, 7, 18, 0.9); 
            border-top: 1px solid rgba(0, 240, 255, 0.2); 
            backdrop-filter: blur(12px);
        }
        .input-row { display: flex; gap: 10px; }
        
        #send-btn {
            background: transparent; border: 1px solid var(--accent); color: var(--accent);
            border-radius: 14px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        #send-btn:not(:disabled):hover {
            background: var(--accent); color: #000000; box-shadow: var(--cyber-glow);
        }
        #send-btn:disabled { border-color: #1e293b; color: #334155; opacity: 0.5; cursor: not-allowed; }

        #cooldown-box {
            text-align: center; color: #f43f5e; font-size: 11px;
            margin-top: 8px; font-weight: bold; letter-spacing: 0.5px;
            text-shadow: 0 0 6px rgba(244, 63, 94, 0.5);
        }

        /* BAN SİSTEMİ */
        #ban-screen {
            background: #030712; z-index: 10000; justify-content: center;
            align-items: center; flex-direction: column; padding: 40px; text-align: center;
        }
        .ban-glow { color: #f43f5e; text-shadow: 0 0 15px rgba(244, 63, 94, 0.8); }
    </style>
</head>
<body>

    <div id="ban-screen" class="app-layer hidden">
        <h1 style="font-size: 40px; margin-bottom: 10px;">⏳</h1>
        <h2>Günlük Sınır Doldu</h2>
        <p style="color: var(--text-dim);">1 saatlik kullanım sürenizi tamamladınız. Güvenliğiniz için erişim 00:00'a kadar kısıtlanmıştır.</p>
    </div>

    <div id="login-screen" class="app-layer">
        <div class="welcome-card">
            <h1 style="font-size: 28px;">Nexathel Asistanı</h1>
            <p style="color: var(--text-dim);">v16 sistemi hakkında her şey.</p>
            <input type="text" id="uname" placeholder="Adınızı belirleyin...">
            <button class="btn-main" onclick="launchApp()">Sistemi Aç</button>
        </div>
    </div>

    <div id="main-app" class="app-layer hidden">
        <header>
            <div id="user-tag" style="font-size: 18px; font-weight: bold; letter-spacing: -0.5px; color: var(--accent); text-shadow: var(--cyber-glow);">Merhaba *</div>
            <div id="session-clock" style="font-size: 12px; color: var(--text-dim); border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; background: rgba(0,0,0,0.3);">00:00</div>
        </header>

        <div id="chat-flow"></div>

        <footer>
            <div class="input-row">
                <input type="text" id="msg-input" placeholder="Nexathel v16 hakkında bir şey sorun..." style="margin:0;">
                <button id="send-btn" onclick="processMessage()" style="width: auto; padding: 0 20px;">Sor</button>
            </div>
            <div id="cooldown-box" class="hidden">YENİ HAK: <span id="cd-timer">02:00</span></div>
        </footer>
    </div>

    <script>
        const API_KEY = "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";
        let activeUser = "";
        let deviceId = "";

        if (!localStorage.getItem('nex_dev_id')) {
            localStorage.setItem('nex_dev_id', 'dev_' + Math.random().toString(36).substr(2, 9));
        }
        deviceId = localStorage.getItem('nex_dev_id');

        const SYSTEM_PROMPT = `Sen Nexathel v16 platformunun resmi ve uzman yapay zeka asistanısın. Görevin, kullanıcılara platformdaki oyunlar, görevler ve mekanikler hakkında bilgi vermektir.

Platform Bilgileri:
1. Ana Menü / Oyunlar: Uçan Kuş (Flappy Bird), Dinozor, Hafıza (Simon Says), Stack Oyunu, Dart Ustası, 2048, Yılan(io), Lumberjack, Mayın Tarlası (20x20), Pac-Man, Crazy Motorcycle ve Stickman Savaş.
2. Görevler Sistemi: Kullanıcılar 5 temel görevi (Hız Testi, Kusursuz Daire, Yıldırım Yazma ["Nexathel v16 burada."], Clicker Pro, İnek Nerede?) geçerek 5 Altın Jeton toplar ve "Efsanevi Premium Oyunlar" kilidini açar.
3. Brawl Stars RPG Modu: Üstten görünümlü haritada botlara karşı mücadele edilir. Karakterler: Ket (Support, ulti atlama), Edgir (Assassin, hızlı hasar ve ulti atlama), Şeli (Fighter, Mega Shot). Can ve hasar barları bulunur.`;

        function launchApp() {
            const name = document.getElementById("uname").value.trim();
            if (!name) return;
            activeUser = name.toLowerCase();

            if (isBanned()) return;

            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("main-app").classList.remove("hidden");
            document.getElementById("user-tag").innerText = "Merhaba " + name;

            runGlobalTimer();
            checkCooldown();
        }

        function runGlobalTimer() {
            setInterval(() => {
                let totalSeconds = parseInt(localStorage.getItem(`sec_${deviceId}`) || 0);
                totalSeconds++;
                localStorage.setItem(`sec_${deviceId}`, totalSeconds);

                let m = Math.floor(totalSeconds / 60);
                let s = totalSeconds % 60;
                document.getElementById("session-clock").innerText = `${m}dk ${s}sn / 60dk`;

                if (totalSeconds >= 3600) triggerBan();
            }, 1000);
        }

        function isBanned() {
            const today = new Date().toDateString();
            const savedDate = localStorage.getItem(`date_${deviceId}`);

            if (savedDate !== today) {
                localStorage.setItem(`date_${deviceId}`, today);
                localStorage.setItem(`sec_${deviceId}`, 0);
                return false;
            }

            if (parseInt(localStorage.getItem(`sec_${deviceId}`) || 0) >= 3600) {
                triggerBan();
                return true;
            }
            return false;
        }

        function triggerBan() {
            document.getElementById("main-app").classList.add("hidden");
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("ban-screen").classList.remove("hidden");
        }

        function checkCooldown() {
            const last = parseInt(localStorage.getItem(`last_${deviceId}`) || 0);
            const diff = Date.now() - last;
            if (diff < 120000) startCooldown(120000 - diff);
        }

        function startCooldown(duration) {
            const btn = document.getElementById("send-btn");
            const inp = document.getElementById("msg-input");
            const box = document.getElementById("cooldown-box");
            const clock = document.getElementById("cd-timer");

            btn.disabled = true;
            inp.disabled = true;
            box.classList.remove("hidden");

            let remaining = duration;
            const timer = setInterval(() => {
                remaining -= 1000;
                let mins = Math.floor(remaining / 60000);
                let secs = Math.floor((remaining % 60000) / 1000);
                clock.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;

                if (remaining <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    inp.disabled = false;
                    box.classList.add("hidden");
                }
            }, 1000);
        }

        async function processMessage() {
            const inp = document.getElementById("msg-input");
            const text = inp.value.trim();
            if (!text) return;

            localStorage.setItem(`last_${deviceId}`, Date.now().toString());
            addBubble(text, 'u-msg');
            inp.value = "";
            startCooldown(120000);

            const aiId = "ai-" + Date.now();
            addBubble("Düşünüyorum...", 'ai-msg', aiId);

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                    body: JSON.stringify({ 
                        model: "llama-3.3-70b-versatile", 
                        messages: [
                            { role: "system", content: SYSTEM_PROMPT },
                            { role: "user", content: text }
                        ] 
                    })
                });
                const data = await res.json();
                document.getElementById(aiId).innerText = data.choices[0].message.content;
            } catch {
                document.getElementById(aiId).innerText = "Nexathel sistemi şu an yanıt veremiyor.";
            }
        }

        function addBubble(text, cls, id = "") {
            const flow = document.getElementById("chat-flow");
            const d = document.createElement("div");
            d.className = `bubble ${cls}`;
            if(id) d.id = id;
            d.innerText = text;
            flow.appendChild(d);
            flow.scrollTop = flow.scrollHeight;
        }
    </script>
</body>
</html>

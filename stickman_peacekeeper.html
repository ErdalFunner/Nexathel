<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stickman Peacekeeper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #000; 
            display: flex;
            flex-direction: column;
        }

        .header { 
            height: 50px; 
            background-color: #333; 
            display: flex; 
            align-items: center; 
            padding: 0 15px; 
            z-index: 1000;
        }
        
        .back-button { 
            text-decoration: none; 
            color: white; 
            background-color: #e74c3c; 
            padding: 8px 15px; 
            border-radius: 5px; 
            font-weight: bold; 
        }

        .iframe-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        /* GÜNCELLENEN KATMAN: Orta Kısmı Açık Kalkan */
        .full-bottom-shield {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            z-index: 999999; 
            background: transparent; /* Görsel test için 'rgba(255,0,0,0.3)' yapabilirsiniz */
            pointer-events: auto;

            /* clip-path ile orta %40'lık dilimi (30'dan 70'e kadar) tıklanabilir yapar */
            /* Sadece kenarlar (sol %30 ve sağ %30) felç kalır */
            clip-path: polygon(
                0% 0%, 30% 0%, 30% 100%, 70% 100%, 70% 0%, 100% 0%, 100% 100%, 0% 100%
            );
            -webkit-clip-path: polygon(
                0% 0%, 30% 0%, 30% 100%, 70% 100%, 70% 0%, 100% 0%, 100% 100%, 0% 100%
            );
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        .footer { 
            height: 60px; 
            background-color: #222; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000;
        }
        
        .youtube-link { 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            color: white; 
            background-color: #ff0000; 
            padding: 10px 20px; 
            border-radius: 50px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-button">← GERİ DÖN</a>
    </div>

    <div class="iframe-container">
        <!-- Bu katman artık sadece sağ ve sol köşeleri engeller, orta boşluktan iframe'e tıklanabilir -->
        <div class="full-bottom-shield"></div>

        <iframe 
            src="https://www.miniplay.com/game/stickman-peacekeeper/play" 
            sandbox="allow-scripts allow-same-origin allow-forms"
            allow="autoplay">
        </iframe>
    </div>

    <div class="footer">
        <a href="https://m.youtube.com/channel/UCeNtqm2o1s8uZ0rPIc4Syew" target="_blank" class="youtube-link">
            <i class="fab fa-youtube"></i> ABONE OL
        </a>
    </div>

</body>
</html>

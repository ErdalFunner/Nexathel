<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexathel | v16</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #000; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            background: #1a1a1a; 
            padding: 50px 30px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            position: relative;
            border: 1px solid #2a2a2a;
        }

        /* Sabit, Yapışık Duran Siber Asistan Modülü */
        .cyber-assistant-wrapper {
            display: flex;
            justify-content: center;
            margin-top: -20px;
            margin-bottom: 40px;
        }

        .cyber-assistant-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #00f0ff; 
            background: #222;
            padding: 12px 30px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0, 240, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .live-indicator {
            width: 10px;
            height: 10px;
            background-color: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f0ff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7); }
            70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 8px rgba(0, 240, 255, 0); }
            100% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
        }

        .cyber-assistant-btn:hover {
            color: #fff;
            background: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }

        .cyber-assistant-btn:hover .live-indicator {
            background-color: #fff;
            box-shadow: 0 0 10px #fff;
        }

        h1.brand {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 25px rgba(255,255,255,0.3);
        }

        h2.subtitle {
            font-weight: 300;
            font-size: 1.8rem;
            margin-bottom: 50px;
            color: #bbb;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 30px;
        }

        @media (orientation: landscape) {
            .game-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .game-card {
            background: #252525;
            border-radius: 25px;
            padding: 35px 20px;
            text-decoration: none;
            color: white;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #333;
        }

        .game-card:hover {
            transform: scale(1.05); 
            background: #2d2d2d;
            box-shadow: 0 0 40px rgba(255,255,255,0.1); 
            border-color: #666;
        }

        .game-card img {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .game-card span {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .footer-btn {
            display: inline-block;
            text-decoration: none;
            margin-top: 60px;
            padding: 15px 60px;
            background: #d40d12;
            color: white;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
        }

        .footer-btn:hover {
            background: #f00;
            transform: translateY(-3px);
        }

        /* ================= FÜTÜRİSTİK GEÇİŞ ANİMASYONU KATMANI ================= */
        .cyber-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .cyber-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Dijital Tarama Çizgisi */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #00f0ff;
            box-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff;
            opacity: 0;
        }

        .cyber-overlay.active .scan-line {
            animation: scan 1.2s linear infinite;
            opacity: 1;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* Matrix / Veri Yükleme Çemberi */
        .cyber-spinner {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px dashed rgba(0, 240, 255, 0.2);
            border-top: 2px solid #00f0ff;
            border-bottom: 2px solid #00f0ff;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .cyber-text {
            color: #00f0ff;
            font-family: monospace;
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00f0ff;
            animation: glitch-text 0.6s infinite alternate;
        }

        @keyframes glitch-text {
            0% { opacity: 0.7; }
            100% { opacity: 1; text-shadow: 0 0 15px #00f0ff, 2px 2px #ff0055; }
        }
    </style>
</head>
<body>

<div class="cyber-overlay" id="cyberOverlay">
    <div class="scan-line"></div>
    <div class="cyber-spinner"></div>
    <div class="cyber-text">BAĞLANTI KURULUYOR...</div>
</div>

<div class="main-container">

    <div class="cyber-assistant-wrapper">
        <div class="cyber-assistant-btn" onclick="startCyberTransition('asistan.html')">
            <div class="live-indicator"></div>
            Nexathel v16 Asistanı
        </div>
    </div>

    <h1 class="brand">Nexathel | v16</h1>
    <h2 class="subtitle">Oyun Seçiniz</h2>
    
    <div class="game-grid">
        <a href="flappy.html" class="game-card">
            <img src="flappy.png" alt="Uçan Kuş">
            <span>Uçan Kuş</span>
        </a>

        <a href="dino.html" class="game-card">
            <img src="dinozor.png" alt="Dinozor">
            <span>Dinozor</span>
        </a>

        <a href="hafiza.html" class="game-card">
            <img src="hafiza.png" alt="Hafıza">
            <span>Hafıza</span>
        </a>

        <a href="stack.html" class="game-card">
            <img src="stack.png" alt="Stack">
            <span>Stack Oyunu</span>
        </a>

        <a href="dart.html" class="game-card">
            <img src="dart.png" alt="Dart">
            <span>Dart Ustası</span>
        </a>

        <a href="2048.html" class="game-card">
            <img src="2048.png" alt="2048">
            <span>2048</span>
        </a>

        <a href="yılan.html" class="game-card">
            <img src="yılan.png" alt="Yılan(io)">
            <span>Yılan(io)</span>
        </a>

        <a href="lumberjack.html" class="game-card">
            <img src="lumberjack.png" alt="Lumberjack">
            <span>Lumberjack</span>
        </a>

        <a href="mayin.html" class="game-card">
            <img src="mayin.png" alt="Mayın Tarlası">
            <span>Mayın Tarlası</span>
        </a>

        <a href="pac-man.html" class="game-card">
            <img src="pac-man.png" alt="Pac-Man">
            <span>Pac-Man</span>
        </a>

        <a href="crazymotorcyle.html" class="game-card">
            <img src="motor.png" alt="Crazy Motorcyle">
            <span>Crazy Motorcyle</span>
        </a>

        <a href="stickman_peacekeeper.html" class="game-card">
            <img src="çubuk.png" alt="Stickman Savaş">
            <span>Stickman Savaş</span>
        </a>
    </div>

    <a href="görevler.html" class="footer-btn">Görevler</a>
</div>

<script>
    // Fütüristik Geçişi Başlatan Fonksiyon
    function startCyberTransition(targetUrl) {
        const overlay = document.getElementById('cyberOverlay');
        
        // Animasyon ekranını aktif et
        overlay.classList.add('active');
        
        // 1.5 saniye animasyon oynatıldıktan sonra sayfaya yönlendir
        setTimeout(() => {
            window.location.href = targetUrl;
        }, 1500);
    }
</script>

</body>
</html>

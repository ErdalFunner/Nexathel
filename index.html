<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexathel | v16</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #000; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            background: #1a1a1a; 
            padding: 50px 30px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        h1.brand {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 25px rgba(255,255,255,0.3);
        }

        h2.subtitle {
            font-weight: 300;
            font-size: 1.8rem;
            margin-bottom: 50px;
            color: #bbb;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 30px;
        }

        @media (orientation: landscape) {
            .game-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .game-card {
            background: #252525;
            border-radius: 25px;
            padding: 35px 20px;
            text-decoration: none;
            color: white;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #333;
        }

        .game-card:hover {
            transform: scale(1.05); 
            background: #2d2d2d;
            box-shadow: 0 0 40px rgba(255,255,255,0.1); 
            border-color: #666;
        }

        .game-card img {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .game-card span {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .footer-btn {
            display: inline-block;
            text-decoration: none;
            margin-top: 60px;
            padding: 15px 60px;
            background: #d40d12;
            color: white;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
        }

        .footer-btn:hover {
            background: #f00;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1 class="brand">Nexathel | v16</h1>
    <h2 class="subtitle">Oyun Seçiniz</h2>
    
    <div class="game-grid">
        <a href="flappy.html" class="game-card">
            <img src="flappy.png" alt="Uçan Kuş">
            <span>Uçan Kuş</span>
        </a>

        <a href="dino.html" class="game-card">
            <img src="dinozor.png" alt="Dinozor">
            <span>Dinozor</span>
        </a>

        <a href="hafiza.html" class="game-card">
            <img src="hafiza.png" alt="Hafıza">
            <span>Hafıza</span>
        </a>

        <a href="stack.html" class="game-card">
            <img src="stack.png" alt="Stack">
            <span>Stack Oyunu</span>
        </a>

        <a href="dart.html" class="game-card">
            <img src="dart.png" alt="Dart">
            <span>Dart Ustası</span>
        </a>

        <a href="2048.html" class="game-card">
            <img src="2048.png" alt="2048">
            <span>2048</span>
        </a>

        <a href="yılan.html" class="game-card">
            <img src="yılan.png" alt="Yılan(io)">
            <span>Yılan(io)</span>
        </a>

        <a href="lumberjack.html" class="game-card">
            <img src="lumberjack.png" alt="Lumberjack">
            <span>Lumberjack</span>
        </a>

        <a href="mayin.html" class="game-card">
            <img src="mayin.png" alt="Mayın Tarlası">
            <span>Mayın Tarlası</span>
        </a>

        <a href="pac-man.html" class="game-card">
            <img src="pac-man.png" alt="Pac-Man">
            <span>Pac-Man</span>
        </a>

        <a href="crazymotorcyle.html" class="game-card">
            <img src="motor.png" alt="Crazy Motorcyle">
            <span>Crazy Motorcyle</span>
        </a>

        <a href="stickman_peacekeeper.html" class="game-card">
            <img src="çubuk.png" alt="Stickman Savaş">
            <span>Stickman Savaş</span>
        </a>
    </div>

    <a href="görevler.html" class="footer-btn">Görevler</a>
</div>

</body>
</html>

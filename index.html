<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexathel | v16</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #000; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .main-container {
            width: 95%;
            max-width: 1000px;
            background: #1a1a1a; 
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1.brand {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        h2.subtitle {
            font-weight: 300;
            margin-bottom: 40px;
            color: #bbb;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 25px;
        }

        @media (orientation: landscape) {
            .game-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .game-card {
            background: #252525;
            border-radius: 20px;
            padding: 20px;
            text-decoration: none;
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #333;
        }

        .game-card:hover {
            transform: scale(1.08); 
            background: #333;
            box-shadow: 0 0 30px rgba(255,255,255,0.15); 
            border-color: #555;
        }

        .game-card img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            object-fit: contain;
        }

        .game-card span {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .footer-btn {
            display: inline-block;
            text-decoration: none;
            margin-top: 40px;
            padding: 12px 40px;
            background: #d40d12;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .footer-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1 class="brand">Nexathel | v16</h1>
    <h2 class="subtitle">Oyun Seçiniz</h2>
    
    <div class="game-grid">
        <a href="flappy.html" class="game-card">
            <img src="flappy.png" alt="Uçan Kuş">
            <span>Uçan Kuş</span>
        </a>

        <a href="dino.html" class="game-card">
            <img src="dinozor.png" alt="Dinozor">
            <span>Dinozor</span>
        </a>

        <a href="hafiza.html" class="game-card">
            <img src="hafiza.png" alt="Hafıza">
            <span>Hafıza</span>
        </a>

        <a href="stack.html" class="game-card">
            <img src="stack.png" alt="Stack">
            <span>Stack Oyunu</span>
        </a>

        <a href="dart.html" class="game-card">
            <img src="dart.png" alt="Dart">
            <span>Dart Ustası</span>
        </a>

        <a href="2048.html" class="game-card">
            <img src="2048.png" alt="2048">
            <span>2048</span>
        </a>

        <a href="yılan.html" class="game-card">
            <img src="yılan.png" alt="Yılan(io)">
            <span>Yılan(io)</span>
        </a>

        <a href="lumberjack.html" class="game-card">
            <img src="lumberjack.png" alt="Lumberjack">
            <span>Lumberjack</span>
        </a>

        <a href="mayin.html" class="game-card">
            <img src="mayin.png" alt="Mayın Tarlası">
            <span>Mayın Tarlası</span>
        </a>

        <!-- Yeni Eklenen: Pac-Man -->
        <a href="pac-man.html" class="game-card">
            <img src="pac-man.png" alt="Pac-Man">
            <span>Pac-Man</span>
        </a>
    </div>

    <a href="görevler.html" class="footer-btn">Görevler</a>
</div>

</body>
</html>

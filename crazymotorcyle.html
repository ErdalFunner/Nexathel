<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crazy Motorcycle Fix</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #000; }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header { height: 50px; background: #333; z-index: 10; }

        .iframe-wrapper {
            position: relative;
            flex-grow: 1;
            width: 100%;
        }

        /* STRATEJİK KATMAN: Tam Ekranı Engelleyen Shield */
        .blocker-shield {
            position: absolute;
            /* Oyun sitesindeki tam ekran butonu genelde sağ alt veya orta alt kısımdadır. 
               Bu alanı komple 'tıklanamaz' yapıyoruz. */
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px; /* Bu yüksekliği oyunun 'play' butonuna göre ayarla */
            z-index: 9999;
            background: rgba(255, 0, 0, 0); /* Görünmez ama orada */
            pointer-events: auto; /* Tıklamayı burada hapseder */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer { height: 60px; background: #222; z-index: 10; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"></div>

    <div class="iframe-wrapper">
        <!-- Bu katman iframe'in önünde bir duvar gibi durur -->
        <div class="blocker-shield"></div>

        <iframe 
            src="https://www.miniplay.com/game/crazy-motorcycle/play"
            /* Sandbox'ı daha da daraltıyoruz */
            sandbox="allow-scripts allow-same-origin allow-forms"
            /* Kesinlikle tam ekrana izin verme */
            scrolling="no">
        </iframe>
    </div>

    <div class="footer"></div>
</div>

<script>
    // Bazı WebView'ler dokunmatik hareketleri zorla tam ekrana çevirir.
    // Bunu engellemek için iframe üzerindeki 'touchstart' olayını dinleyebiliriz.
    document.querySelector('.blocker-shield').addEventListener('touchstart', function(e) {
        // Tıklamanın iframe'e geçmesini burada durduruyoruz
        console.log("Tam ekran butonu alanı koruma altında.");
    }, { passive: false });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yılan</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        .header {
            height: 50px;
            background-color: #333;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }
        .back-button {
            text-decoration: none;
            color: white;
            background-color: #e74c3c;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .back-button:hover {
            background-color: #c0392b;
        }
        iframe {
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-button">← GERİ DÖN</a>
    </div>
    <iframe 
        src="https://snake.io/crazygames/" 
        sandbox="allow-scripts allow-same-origin allow-forms"
        allow="autoplay; fullscreen">
    </iframe>
</body>
</html>

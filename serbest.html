<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serbest Takılma Menüsü</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .container {
            text-align: center;
            background: #34495e;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .menu-buttons {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: transform 0.2s, background 0.3s;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn-bird { background-color: #f1c40f; color: #000; }
        .btn-dino { background-color: #27ae60; }
        .btn-memory { background-color: #9b59b6; }
        .btn-stack { background-color: #3498db; }
        .btn-hedef { background-color: #d40d12; }
        .btn-2048 { background-color: #d60; }
        .btn-home { 
            background-color: #e74c3c; 
            margin-top: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Oyun Seçiniz</h1>
    
    <div class="menu-buttons">
        <a href="flappy.html" class="btn btn-bird">Uçan Kuş</a>
        <a href="dino.html" class="btn btn-dino">Dinozor</a>
        <a href="hafiza.html" class="btn btn-memory">Hafıza</a>
        <a href="stack.html" class="btn btn-stack">Stack Oyunu</a>
       <a href="hedef.html" class="btn btn-hedef">Dart Ustası</a>
       <a href="2048.html" class="btn btn-2048">2048</a>
    </div>

    <hr style="margin-top: 30px; border: 0; border-top: 1px solid #5d6d7e;">

    <a href="index.html" class="btn btn-home">Ana Menü</a>
</div>

</body>
</html>
